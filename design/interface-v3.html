<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ClawFiles 界面原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --line: #e7ebed;
      --line-strong: #d8dfe2;
      --text: #202426;
      --text-2: #626b70;
      --text-3: #91999d;
      --accent: #15978f;
      --accent-hover: #11877f;
      --accent-soft: #e9f6f4;
      --danger: #d05555;
      --radius: 12px;
      --shadow: 0 8px 28px rgba(32, 47, 53, 0.07);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111415;
      --surface: #191d1f;
      --surface-subtle: #1e2325;
      --line: #2a3032;
      --line-strong: #363d40;
      --text: #ecf0f1;
      --text-2: #aab2b5;
      --text-3: #778084;
      --accent: #58bdb5;
      --accent-hover: #6ac8c0;
      --accent-soft: #193431;
      --danger: #e17b7b;
      --shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .brand {
      flex: 0 0 auto;
      font-size: 17px;
      font-weight: 680;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-2);
      font-size: 12px;
    }

    .server-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .topbar-spacer {
      flex: 1;
    }

    .search {
      width: 260px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 12px;
      background: var(--surface-subtle);
      color: var(--text);
      transition: border-color 140ms ease, background 140ms ease;
    }

    .search::placeholder {
      color: var(--text-3);
    }

    .search:focus {
      border-color: var(--accent);
      outline: none;
      background: var(--surface);
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      color: var(--text-2);
      transition: background 140ms ease, border-color 140ms ease;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-subtle);
    }

    .app {
      width: min(1120px, calc(100% - 40px));
      margin: 28px auto 64px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .breadcrumb {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      overflow: hidden;
      color: var(--text-2);
    }

    .breadcrumb strong {
      color: var(--text);
      font-size: 18px;
      font-weight: 620;
      letter-spacing: -0.01em;
    }

    .breadcrumb span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-actions {
      display: flex;
      gap: 9px;
    }

    .button {
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 0 14px;
      background: var(--surface);
      cursor: pointer;
      font-weight: 540;
      transition: background 140ms ease, border-color 140ms ease, transform 80ms ease;
    }

    .button:hover {
      background: var(--surface-subtle);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .upload-task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .type-block {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #edf1f7;
      color: #54627c;
      font-size: 10px;
      font-weight: 720;
      letter-spacing: 0.05em;
    }

    :root[data-theme="dark"] .type-block {
      background: #28303d;
      color: #b7c3db;
    }

    .upload-copy {
      min-width: 0;
    }

    .upload-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .upload-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 560;
    }

    .upload-title span {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 3px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--line);
    }

    .progress > span {
      display: block;
      width: 68%;
      height: 100%;
      background: var(--accent);
    }

    .upload-meta {
      display: flex;
      gap: 16px;
      margin-top: 7px;
      color: var(--text-3);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .file-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-toolbar {
      min-height: 56px;
      padding: 10px 12px 10px 17px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .path {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-2);
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .toolbar-group {
      display: flex;
      gap: 6px;
    }

    .toolbar-button {
      height: 32px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }

    .toolbar-button:hover,
    .toolbar-button.active {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .file-header,
    .file-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 130px 180px 160px;
      align-items: center;
      column-gap: 12px;
    }

    .file-header {
      height: 38px;
      padding: 0 18px;
      color: var(--text-3);
      font-size: 11px;
    }

    .file-row {
      min-height: 68px;
      padding: 0 18px;
      border-top: 1px solid var(--line);
      transition: background 120ms ease;
    }

    .file-row:hover {
      background: var(--surface-subtle);
    }

    .file-name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .file-name-copy {
      min-width: 0;
    }

    .file-name-copy strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 540;
    }

    .file-mobile-meta {
      display: none;
      margin-top: 3px;
      color: var(--text-3);
      font-size: 11px;
    }

    .file-size,
    .file-time {
      color: var(--text-2);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .file-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .action-button {
      height: 30px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }

    .action-button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .file-empty-space {
      height: 112px;
      display: grid;
      place-items: center;
      border-top: 1px solid var(--line);
      color: var(--text-3);
      font-size: 12px;
    }

    .bottom-nav {
      display: none;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      max-width: min(390px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast strong {
      display: block;
      margin-bottom: 3px;
      font-weight: 560;
    }

    .toast code {
      color: var(--text-2);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      word-break: break-all;
    }

    @media (max-width: 720px) {
      .topbar {
        height: 54px;
      }

      .topbar-inner,
      .app {
        width: calc(100% - 28px);
      }

      .server-status,
      .search {
        display: none;
      }

      .topbar-inner {
        gap: 12px;
      }

      .app {
        margin-top: 18px;
        margin-bottom: 92px;
      }

      .page-heading {
        align-items: flex-start;
      }

      .breadcrumb {
        display: block;
      }

      .breadcrumb strong {
        display: block;
        margin-bottom: 4px;
      }

      .page-actions .button:not(.primary) {
        display: none;
      }

      .button.primary {
        height: 34px;
        padding-inline: 13px;
      }

      .upload-task {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 12px;
      }

      .upload-task > .icon-button {
        display: none;
      }

      .upload-meta {
        gap: 10px;
      }

      .file-panel {
        box-shadow: none;
      }

      .panel-toolbar {
        min-height: 50px;
        padding-left: 13px;
      }

      .toolbar-group .toolbar-button:first-child,
      .toolbar-group .toolbar-button:nth-child(2) {
        display: none;
      }

      .file-header {
        display: none;
      }

      .file-row {
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 72px;
        padding: 0 12px;
      }

      .file-size,
      .file-time {
        display: none;
      }

      .file-mobile-meta {
        display: block;
      }

      .file-actions .action-button:first-child {
        display: none;
      }

      .action-button {
        padding-inline: 8px;
        color: var(--accent);
      }

      .file-empty-space {
        height: 78px;
      }

      .bottom-nav {
        position: fixed;
        inset: auto 0 0;
        height: calc(62px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        border-top: 1px solid var(--line);
        background: var(--surface);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .bottom-nav button {
        border: 0;
        background: transparent;
        color: var(--text-3);
        font-size: 12px;
      }

      .bottom-nav button.active {
        color: var(--accent);
        font-weight: 580;
      }

      .toast {
        right: 16px;
        bottom: calc(76px + env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">claw<span>files</span></div>
      <div class="server-status">服务器在线</div>
      <div class="topbar-spacer"></div>
      <input class="search" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" />
      <button class="icon-button" id="theme-button" type="button" aria-label="切换深色模式">◐</button>
    </div>
  </header>

  <main class="app">
    <section class="page-heading" aria-label="当前目录">
      <div class="breadcrumb">
        <strong>文件</strong>
        <span>/srv/openclaw/files</span>
      </div>
      <div class="page-actions">
        <button class="button" type="button">新建文件夹</button>
        <button class="button primary" id="upload-button" type="button">上传</button>
        <input id="file-picker" type="file" multiple hidden />
      </div>
    </section>

    <section class="upload-task" aria-label="上传任务">
      <div class="type-block">ZIP</div>
      <div class="upload-copy">
        <div class="upload-title">
          <strong>项目素材-0724.zip</strong>
          <span>68%</span>
        </div>
        <div class="progress" aria-label="上传进度 68%">
          <span></span>
        </div>
        <div class="upload-meta">
          <span>1.2 GB / 1.8 GB</span>
          <span>18.4 MB/s</span>
          <span>剩余 34 秒</span>
        </div>
      </div>
      <button class="icon-button" type="button" aria-label="暂停上传">Ⅱ</button>
    </section>

    <section class="file-panel" aria-label="文件列表">
      <div class="panel-toolbar">
        <div class="path">/srv/openclaw/files</div>
        <div class="toolbar-group">
          <button class="toolbar-button" type="button">刷新</button>
          <button class="toolbar-button active" type="button">列表</button>
          <button class="toolbar-button" type="button">修改时间</button>
        </div>
      </div>

      <div class="file-header" aria-hidden="true">
        <span>名称</span>
        <span>大小</span>
        <span>修改时间</span>
        <span>操作</span>
      </div>

      <article class="file-row">
        <div class="file-name">
          <div class="type-block" style="background:#fbeeee;color:#c04d4d">PDF</div>
          <div class="file-name-copy">
            <strong>需求说明.pdf</strong>
            <span class="file-mobile-meta">24.6 MB，今天 14:20</span>
          </div>
        </div>
        <div class="file-size">24.6 MB</div>
        <time class="file-time">今天 14:20</time>
        <div class="file-actions">
          <button class="action-button" type="button">预览</button>
          <button class="action-button copy-button" type="button"
            data-path="/srv/openclaw/files/需求说明.pdf">复制路径</button>
        </div>
      </article>

      <article class="file-row">
        <div class="file-name">
          <div class="type-block" style="background:#eef0fa;color:#5f659f">MP4</div>
          <div class="file-name-copy">
            <strong>训练视频.mp4</strong>
            <span class="file-mobile-meta">1.36 GB，今天 13:58</span>
          </div>
        </div>
        <div class="file-size">1.36 GB</div>
        <time class="file-time">今天 13:58</time>
        <div class="file-actions">
          <button class="action-button" type="button">预览</button>
          <button class="action-button copy-button" type="button"
            data-path="/srv/openclaw/files/训练视频.mp4">复制路径</button>
        </div>
      </article>

      <article class="file-row">
        <div class="file-name">
          <div class="type-block">ZIP</div>
          <div class="file-name-copy">
            <strong>微信资料.zip</strong>
            <span class="file-mobile-meta">312.7 MB，今天 12:41</span>
          </div>
        </div>
        <div class="file-size">312.7 MB</div>
        <time class="file-time">今天 12:41</time>
        <div class="file-actions">
          <button class="action-button" type="button">预览</button>
          <button class="action-button copy-button" type="button"
            data-path="/srv/openclaw/files/微信资料.zip">复制路径</button>
        </div>
      </article>

      <div class="file-empty-space">共 3 个文件</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <button class="active" type="button">文件</button>
    <button type="button">上传</button>
    <button type="button">最近</button>
  </nav>

  <aside class="toast" id="toast" role="status" aria-live="polite">
    <strong>路径已复制</strong>
    <code id="toast-path"></code>
  </aside>

  <script>
    const root = document.documentElement;
    const themeButton = document.querySelector("#theme-button");
    const uploadButton = document.querySelector("#upload-button");
    const filePicker = document.querySelector("#file-picker");
    const toast = document.querySelector("#toast");
    const toastPath = document.querySelector("#toast-path");
    let toastTimer;

    themeButton.addEventListener("click", () => {
      root.dataset.theme = root.dataset.theme === "dark" ? "" : "dark";
    });

    uploadButton.addEventListener("click", () => filePicker.click());

    document.querySelectorAll(".copy-button").forEach((button) => {
      button.addEventListener("click", async () => {
        const path = button.dataset.path;
        try {
          await navigator.clipboard.writeText(path);
        } catch {
          // The prototype can run from file:// where clipboard permission varies.
        }
        toastPath.textContent = path;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
      });
    });
  </script>
</body>
</html>
