services:
  clawfiles:
    image: ${CLAWFILES_IMAGE:-ghcr.io/edwinzzzs2/openclaw_files:latest}
    container_name: clawfiles
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      STORAGE_ROOT: "/data"
      HOST_PATH_PREFIX: "${HOST_STORAGE_PATH}"
      APP_PASSWORD: "${APP_PASSWORD:?APP_PASSWORD is required}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-107374182400}"
      UPLOAD_CHUNK_SIZE: "${UPLOAD_CHUNK_SIZE:-8388608}"
    volumes:
      - "${HOST_STORAGE_PATH}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
