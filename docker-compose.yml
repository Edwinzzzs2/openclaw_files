services:
  clawfiles:
    image: ${CLAWFILES_IMAGE:-ghcr.io/edwinzzzs2/openclaw_files:latest}
    container_name: clawfiles
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${HTTP_PORT:-3661}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      STORAGE_ROOT: "/data"
      HOST_PATH_PREFIX: "${HOST_STORAGE_PATH:-/home/xixili/.openclaw/workspace/xixili/tmpo}"
      APP_PASSWORD: "${APP_PASSWORD:?APP_PASSWORD is required}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-107374182400}"
      UPLOAD_CHUNK_SIZE: "${UPLOAD_CHUNK_SIZE:-2097152}"
      LAN_TRANSFER_ORIGIN: "${LAN_TRANSFER_ORIGIN:-}"
      STUN_TRANSFER_DOMAIN: "${STUN_TRANSFER_DOMAIN:-}"
      STUN_WEBHOOK_TOKEN: "${STUN_WEBHOOK_TOKEN:-}"
      TRANSFER_SIGNING_KEY: "${TRANSFER_SIGNING_KEY:-}"
    volumes:
      - "${HOST_STORAGE_PATH:-/home/xixili/.openclaw/workspace/xixili/tmpo}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
